name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - project: projects/service-health-anomaly-detector
            python-version: "3.11"
          - project: projects/service-reliability-anomaly-platform
            python-version: "3.11"
          - project: projects/feature-drift-monitor
            python-version: "3.11"
          - project: projects/sql-lineage-impact-analyzer
            python-version: "3.12"
          - project: projects/customer-retention-ml
            python-version: "3.11"
          - project: projects/solar-pv-generation-forecasting
            python-version: "3.11"

    defaults:
      run:
        working-directory: ${{ matrix.project }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi
          if [ -f pyproject.toml ]; then python -m pip install -e ".[dev]"; fi

      - name: Run Ruff checks
        if: contains(fromJSON('["projects/customer-retention-ml", "projects/solar-pv-generation-forecasting"]'), matrix.project)
        run: |
          ruff check .
          ruff format --check .

      - name: Run tests
        run: pytest
