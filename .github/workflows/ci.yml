name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        project:
          - projects/service-health-anomaly-detector
          - projects/service-reliability-anomaly-platform
          - projects/feature-drift-monitor
          - projects/sql-lineage-impact-analyzer
          - projects/customer-retention-ml

    defaults:
      run:
        working-directory: ${{ matrix.project }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi
          if [ -f pyproject.toml ]; then python -m pip install -e ".[dev]"; fi

      - name: Run Ruff checks
        if: matrix.project == 'projects/customer-retention-ml'
        run: |
          ruff check .
          ruff format --check .

      - name: Run tests
        run: pytest
