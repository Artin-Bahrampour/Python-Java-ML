name: card-fraud-monitor
on:
  push:
    paths: ["projects/card-fraud-monitor/**"]
jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run: {working-directory: projects/card-fraud-monitor}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install -r python/requirements.txt && cd python && python -m app.train && pytest -q
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: "17"}
      - run: javac -d /tmp/classes java/src/main/java/com/example/fraud/FraudClient.java
