[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "solar-pv-generation-forecasting"
version = "1.0.0"
description = "Leakage-aware short-horizon solar PV generation forecasting with temporal evaluation."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
  "joblib>=1.3,<2.0",
  "numpy>=1.26,<3.0",
  "pandas>=2.1,<3.0",
  "scikit-learn>=1.4,<2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0,<9.0", "ruff>=0.5,<1.0"]

[project.scripts]
pv-forecast = "pv_forecast.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
