[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "customer-retention-ml"
version = "1.0.0"
description = "Reproducible churn classification, baseline comparison, and batch scoring."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26,<3.0", "pandas>=2.1,<3.0", "scikit-learn>=1.4,<2.0", "joblib>=1.3,<2.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0,<9.0", "ruff>=0.5,<1.0"]

[project.scripts]
churn-ml = "churn_ml.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
[tool.ruff]
line-length = 100
target-version = "py311"
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
