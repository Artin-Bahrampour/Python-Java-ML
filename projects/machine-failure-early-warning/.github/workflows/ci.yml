name: CI
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run unit and pipeline tests
        run: python -m unittest discover -s tests -v
      - name: Run CLI smoke evaluation
        run: python -m maintenance_ml.cli --output /tmp/maintenance-report
