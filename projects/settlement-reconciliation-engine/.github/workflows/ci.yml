name: CI

on:
  push:
  pull_request:

jobs:
  build-test-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Build
        run: ./scripts/build.sh
      - name: Test
        run: ./scripts/test.sh
      - name: Docker build
        run: docker build -t settlement-reconciliation-engine .
      - name: Reconciliation smoke test
        run: |
          java -cp build/classes com.artin.reconciliation.Main reconcile \
            --ledger examples/ledger.csv \
            --provider examples/provider.csv \
            --output build/reconciliation-report.csv
          test "$(grep -c '^MATCHED,' build/reconciliation-report.csv)" -eq 3
          grep -q '^AMOUNT_MISMATCH,' build/reconciliation-report.csv
          grep -q '^PROVIDER_ONLY,' build/reconciliation-report.csv
          grep -q '^LEDGER_ONLY,' build/reconciliation-report.csv
