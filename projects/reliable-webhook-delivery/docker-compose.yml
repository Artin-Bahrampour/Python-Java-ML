services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: webhook
      POSTGRES_PASSWORD: webhook
      POSTGRES_DB: webhooks
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U webhook -d webhooks"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  receiver:
    build:
      context: .
      target: devreceiver
    command: ["/app/receiver"]
    environment:
      WEBHOOK_DEMO_SECRET: ${WEBHOOK_DEMO_SECRET:-local-development-secret-change-me-32-bytes}
    expose:
      - "8081"
    restart: unless-stopped

  api:
    build: .
    command: ["/app/api"]
    environment: &app_env
      DB_URL: postgres://webhook:webhook@postgres:5432/webhooks?sslmode=disable
      HTTP_ADDR: :8080
      TARGETS_FILE: /app/config/targets.json
      ALLOW_INSECURE_TARGETS: "true"
      WEBHOOK_DEMO_SECRET: ${WEBHOOK_DEMO_SECRET:-local-development-secret-change-me-32-bytes}
    ports:
      - "8080:8080"
    volumes:
      - ./config/targets.local.json:/app/config/targets.json:ro
    depends_on:
      postgres:
        condition: service_healthy
      receiver:
        condition: service_started
    restart: unless-stopped

  worker:
    build: .
    command: ["/app/worker"]
    environment:
      <<: *app_env
      WORKER_METRICS_ADDR: :9090
    expose:
      - "9090"
    volumes:
      - ./config/targets.local.json:/app/config/targets.json:ro
    depends_on:
      postgres:
        condition: service_healthy
      receiver:
        condition: service_started
    restart: unless-stopped

volumes:
  postgres_data:
