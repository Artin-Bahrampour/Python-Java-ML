name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: webhook
          POSTGRES_PASSWORD: webhook
          POSTGRES_DB: webhooks
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U webhook -d webhooks"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://webhook:webhook@localhost:5432/webhooks?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum
      - name: Verify formatting
        run: test -z "$(gofmt -l $(find . -name '*.go' -not -path './vendor/*'))"
      - name: Download and verify dependencies
        run: go mod download && go mod verify
      - name: Vet
        run: go vet ./...
      - name: Unit and PostgreSQL integration tests
        run: go test -race -count=1 ./...
      - name: Build binaries
        run: go build ./cmd/api ./cmd/worker ./cmd/receiver
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Build production and development container targets
        run: |
          docker build --target runtime -t reliable-webhook-delivery:ci .
          docker build --target devreceiver -t reliable-webhook-delivery:receiver-ci .
