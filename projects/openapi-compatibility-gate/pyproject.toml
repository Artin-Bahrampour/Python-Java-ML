[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openapi-compatibility-gate"
version = "1.0.0"
description = "A deterministic CI gate that detects breaking changes between OpenAPI specifications."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Portfolio Engineering Project"}]
dependencies = ["PyYAML>=6.0.1,<7.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0,<9.0", "coverage[toml]>=7.4,<8.0"]

[project.scripts]
oacg = "oacg.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["oacg"]

[tool.coverage.report]
show_missing = true
fail_under = 85
