name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[dev]'
      - run: coverage run -m pytest
      - run: coverage report
      - name: CLI smoke test
        run: |
          set +e
          oacg examples/baseline.yaml examples/candidate-compatible.yaml --report /tmp/compat.json
          compatible_status=$?
          oacg examples/baseline.yaml examples/candidate-breaking.yaml --report /tmp/breaking.json
          breaking_status=$?
          set -e
          test "$compatible_status" -eq 0
          test "$breaking_status" -eq 1
          python -c "import json; assert json.load(open('/tmp/breaking.json'))['summary']['breaking'] > 0"

  container-smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build runtime image
        run: docker build -t oacg:ci .
      - name: Verify compatible contract exits successfully
        run: docker run --rm -v "$PWD/examples:/specs:ro" oacg:ci /specs/baseline.yaml /specs/candidate-compatible.yaml
      - name: Verify breaking contract fails the gate
        run: |
          set +e
          docker run --rm -v "$PWD/examples:/specs:ro" oacg:ci /specs/baseline.yaml /specs/candidate-breaking.yaml --quiet
          status=$?
          set -e
          test "$status" -eq 1
